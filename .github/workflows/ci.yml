name: ci

on:
  push:
    branches:
      - latest
      - 'agent/**'
  pull_request:
    branches:
      - latest

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make clean check CC=${{ matrix.cc }}

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cppcheck
      - name: Run cppcheck
        run: cppcheck --std=c11 --enable=warning,performance,portability --error-exitcode=1 -Iinclude src

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t sentinel:ci .
