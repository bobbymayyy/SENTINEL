name: ci

on:
  pull_request:
    branches:
      - latest
  push:
    branches:
      - latest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CPPCHECK_IMAGE: neszt/cppcheck-docker:2.21.0

jobs:
  build-test:
    name: build-test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test
        run: make clean check CC=${{ matrix.cc }}

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pull versioned cppcheck image
        run: docker pull "${CPPCHECK_IMAGE}"

      - name: Show cppcheck version
        run: |
          docker run --rm \
            --entrypoint cppcheck \
            "${CPPCHECK_IMAGE}" \
            --version

      - name: Run cppcheck
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint cppcheck \
            "${CPPCHECK_IMAGE}" \
            --std=c11 \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            -Iinclude \
            src

  container-build:
    name: container-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build container
        run: docker build --tag sentinel:ci .

      - name: Smoke-test container
        run: docker run --rm sentinel:ci --version
