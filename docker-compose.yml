services:
  sentinel:
    build: .
    image: sentinel:local
    container_name: sentinel
    pid: host
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /var/log:/host/var/log:ro
      - ./sentinel.example.yaml:/etc/sentinel.yaml:ro
    command: ["--host-roots", "--config", "/etc/sentinel.yaml"]
    restart: unless-stopped
